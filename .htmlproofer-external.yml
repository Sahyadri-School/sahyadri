# html-proofer configuration for the WEEKLY EXTERNAL LINK CHECK ONLY.
# https://github.com/gjtorikian/html-proofer
#
# This is a deliberately separate config from .htmlproofer.yml (the one
# that runs on every push and blocks deploys). That one keeps
# disable_external: true on purpose -- external sites are genuinely
# flaky in CI (rate-limiting, transient outages, bot-blocking), and a
# broken deploy pipeline over someone else's site having a bad five
# minutes is a worse outcome than not catching link rot instantly. This
# config exists so external links get checked too, just on a schedule
# (see .github/workflows/external-links.yml) and reported via a GitHub
# Issue rather than ever blocking a real content change from going live.
disable_external: false
allow_hash_href: true

# Same URL/file exclusions as the main config, for the same reasons —
# see .htmlproofer.yml's own comments. Plus two specific to this
# external check: the bare https://fonts.googleapis.com and
# https://fonts.gstatic.com domains used in <link rel="preconnect">
# tags (head.html, approve.html, maintenance.html) -- the standard
# Google Fonts preconnect pair -- are never meant to be visited as real
# pages; browsers use them purely for early DNS/TLS setup, and Google's
# own servers 404 those exact bare URLs, while the real font-loading
# URLs (with a /css2?family=... path, or the actual font file URLs
# gstatic serves) work fine and are still checked normally.
ignore_urls:
  - /^#/
  - /^mailto:/
  - /^tel:/
  - /\/profiles\//
  - /\/tags/
  - /^https:\/\/fonts\.googleapis\.com\/?$/
  - /^https:\/\/fonts\.gstatic\.com\/?$/

ignore_files:
  - "./_site/feed.xml"
  - "./_site/maintenance-status.json"

# Only Links -- this check exists specifically for external link rot,
# not images/scripts (already covered by the main per-push check).
checks:
  - Links

# Reducing false alarms. A real check on 5 October flagged 25 "broken" links:
# 24 were staff pages on www.sahyadrischool.org answered with 415 ("Unsupported
# Media Type", i.e. the server refusing an automated request), plus one
# timeout; a manual run the day before had found nothing, so these looked
# intermittent. Each false alarm reopens the "External Link Check" issue and
# sends a notification, which teaches people to ignore real ones.
#
# ignore_status_codes: a link that is really gone answers 404, which is still
#   reported; only a 415 reply is not. (Blind spot: a link that genuinely
#   returns 415 would be missed, which is rare.)
ignore_status_codes:
  - 415

# typhoeus: per-request settings. html-proofer's defaults are a 10-second
#   connection timeout and a 30-second total timeout; some slow sites need more.
typhoeus:
  connecttimeout: 30
  timeout: 60

# hydra: how many links are checked at the same moment. The default is 50,
#   which can look like an attack to a small site and get refused or time out;
#   a few at a time is gentler. The weekly check just takes a few minutes longer.
hydra:
  max_concurrency: 8
