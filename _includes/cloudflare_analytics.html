<!-- FILE: _includes/cloudflare_analytics.html — Cloudflare Web Analytics beacon script, enabled via site.cloudflare_analytics (underscore, not hyphen -- matches the Liquid check below) in _config.yml. -->
{% if site.cloudflare_analytics %}
  <!-- Cloudflare Web Analytics -->
  <script
    defer
    src="https://static.cloudflareinsights.com/beacon.min.js"
    data-cf-beacon='{"token": "{{ site.cloudflare_analytics }}"}'
  ></script>
  <!-- End Cloudflare Web Analytics -->
{% endif %}
