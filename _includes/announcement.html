<!-- FILE: _includes/announcement.html — Site-wide announcement banner.
     Controlled entirely from the CMS: an "Announcement" entry (sidebar,
     same type: file pattern as "Site status") edits _data/announcement.yml
     directly -- enabled (on/off), message, style (info/important/urgent),
     and an optional link. Included once, from _layouts/base.html right
     after the nav, so it shows above every page's own content.

     Turning it on takes effect after the next site build (usually
     1-2 minutes after saving), same as the maintenance-mode switch.

     Dismissal: a visitor can close it with the x button, but that only
     hides it on the page they are looking at. Nothing is remembered: it
     comes back on every page load (opening another page, reloading, a new
     visit), and also when the browser's Back/Forward buttons restore a page
     from its cache with the banner still closed (see the pageshow handler
     in the script below). -->
{% assign a = site.data.announcement %}
{% if a.enabled and a.message and a.message != "" %}
  {% assign style = a.style | default: "info" %}
  <div
    id="site-announcement"
    class="site-announcement site-announcement-{{ style }}"
    role="status"
  >
    <div class="site-announcement-inner">
      <span class="site-announcement-text">
        {{ a.message }}
        {% if a.link-url and a.link-url != "" %}
          <a href="{{ a.link-url }}" class="site-announcement-link">{{ a.link-text | default: "Learn more" }}</a>
        {% endif %}
      </span>
      <button type="button" class="site-announcement-close" aria-label="Dismiss this announcement" onclick="dismissSiteAnnouncement()">&times;</button>
    </div>
  </div>
  <script>
    (function () {
      var el = document.getElementById('site-announcement');
      if (!el) return;

      // Closing only hides the banner on the current page: nothing is
      // written to cookies or browser storage, so every new page load shows
      // it again (including simply opening another page of the site).
      window.dismissSiteAnnouncement = function () {
        el.style.display = 'none';
      };

      // The browser's Back/Forward buttons can restore a page from its
      // back/forward cache exactly as it was left -- including a closed
      // banner -- without loading it again. event.persisted is true only in
      // that case; show the banner again so it still comes back every time.
      window.addEventListener('pageshow', function (event) {
        if (event.persisted) el.style.display = '';
      });

      // Sets --site-announcement-offset (read by .site-announcement's
      // margin-top AND top in custom-styles.css) to the navbar's real,
      // currently rendered height, so the banner starts directly below the
      // fixed navbar and stays flush against its bottom edge while scrolling.
      //
      // The navbar does NOT have a single height. At 1200px and wider,
      // beautifuljekyll.css gives .navbar-custom 1.25rem of padding top and
      // bottom (40px in total, so ~109px tall); once the page is scrolled
      // about 50px, assets/js/beautifuljekyll.js adds .top-nav-short, which
      // removes that padding over a 0.5s transition (~69px tall). The offset
      // therefore has to follow the navbar through both states. Measured
      // from the element itself rather than hardcoded, because its height
      // also depends on zoom, font loading and the nav items wrapping at
      // narrow widths.
      function applyNavbarOffset() {
        var navbar = document.querySelector('.navbar-custom');
        if (!navbar) return; // CSS fallback (5rem) applies
        var height = navbar.getBoundingClientRect().height;
        if (height > 0) {
          document.documentElement.style.setProperty('--site-announcement-offset', height + 'px');
        }
      }

      applyNavbarOffset();

      var navbarEl = document.querySelector('.navbar-custom');
      if (navbarEl && typeof ResizeObserver !== 'undefined') {
        // box: 'border-box' is essential. ResizeObserver watches the CONTENT
        // box by default, and the navbar's height change is a padding change
        // (content box unchanged), so a default observer never fires when
        // the navbar shrinks on scroll -- confirmed in a real Chromium: the
        // offset stayed at 109px while the navbar was 69px, leaving a 40px
        // gap between navbar and banner. Border-box fires on every frame of
        // the padding transition, so the banner follows it smoothly.
        new ResizeObserver(applyNavbarOffset).observe(navbarEl, { box: 'border-box' });
      } else {
        // Very old browsers without ResizeObserver: re-measure on resize,
        // and shortly after scrolling (once the 0.5s padding transition
        // has finished).
        var timer;
        var remeasure = function (delay) {
          clearTimeout(timer);
          timer = setTimeout(applyNavbarOffset, delay);
        };
        window.addEventListener('resize', function () { remeasure(100); });
        window.addEventListener('orientationchange', function () { remeasure(100); });
        window.addEventListener('scroll', function () { remeasure(600); }, { passive: true });
      }
    })();
  </script>
{% endif %}
