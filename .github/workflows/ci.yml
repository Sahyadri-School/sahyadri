# GitHub Actions: Build & deploy Jekyll site to GitHub Pages
name: Sahyadri Connect

on:
  push:
    branches: ["master"]
  workflow_dispatch:

# Cancel any in-progress run for the same branch so rapid pushes
# don't queue up multiple simultaneous deploys.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - uses: actions/configure-pages@v5

      - name: Build with Jekyll
        run: |
          set +e
          bundle exec jekyll build 2>&1 | tee /tmp/jekyll_output.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            while IFS= read -r line; do
              echo "::error::$line"
            done < /tmp/jekyll_output.txt
          fi
          exit $status
        env:
          JEKYLL_ENV: production

      - name: Check for broken links (html-proofer)
        run: |
          set +e
          bundle exec ruby check_links.rb 2>&1 | tee /tmp/htmlproofer_output.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            while IFS= read -r line; do
              echo "::error::$line"
            done < /tmp/htmlproofer_output.txt
          fi
          exit $status

      - uses: actions/upload-pages-artifact@v4

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
