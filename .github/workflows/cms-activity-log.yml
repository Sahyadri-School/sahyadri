name: Update CMS Activity Log

# Writes cms-activity-log.md: a plain, readable list of the content changes
# made through Pages CMS in the last 30 days, read from this repository's
# own commit history (see generate_cms_log.py for exactly what counts).
# Shown in the CMS sidebar as a read-only "CMS Activity Log" file entry
# (.pages.yml) -- Pages CMS can only display files already in the repo, so
# this workflow is what keeps that file current.
#
# Runs daily, plus on demand from the "Update CMS activity log" button on
# the CMS Actions page (same payload-input mechanism as external-links.yml;
# see the comment there for how that works). Never blocks or affects the
# site build -- this only ever writes the one log file, nothing else.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      # Pages CMS always sends its context here as JSON when its button starts
      # this workflow. Optional (not required: true as in Pages CMS's own
      # example) so running it by hand from GitHub's Actions tab still works
      # with the box left blank, and the daily schedule is unaffected.
      payload:
        description: "Filled in by the Pages CMS button; leave blank when running from GitHub"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  update-log:
    runs-on: ubuntu-latest
    steps:
      # Records, in the run's own summary, what started it -- the daily
      # schedule, someone on GitHub, or the named person using the CMS
      # button. Identical in spirit to the same step in external-links.yml;
      # kept duplicated rather than factored out since GitHub Actions has no
      # lightweight way to share a single script between two workflow files
      # without adding an extra repository or composite-action layer for
      # what is a few lines of logging.
      - name: Note what started this run
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, os
          raw = os.environ.get("PAYLOAD", "").strip()
          event = os.environ.get("EVENT", "")
          actor = os.environ.get("ACTOR", "unknown")
          if raw:
              try:
                  user = (json.loads(raw).get("triggeredBy") or {})
                  who = "{} (GitHub: {}) using the Pages CMS button".format(
                      user.get("name") or "an unnamed CMS user",
                      user.get("githubUsername") or "no username given")
              except (ValueError, AttributeError):
                  who = "the Pages CMS button (its details could not be read)"
          elif event == "schedule":
              who = "the daily schedule"
          else:
              who = "{} on GitHub".format(actor)
          line = "CMS activity log refresh started by: " + who
          print(line)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(line + "\n")
          PY
        env:
          PAYLOAD: ${{ inputs.payload }}
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history: the log script reads commits by date, not by depth

      - name: Generate the activity log
        run: python3 generate_cms_log.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      # Commits the refreshed file only if it actually changed, so a day
      # with no CMS activity doesn't create an empty commit. Uses the
      # built-in GITHUB_TOKEN as the commit author (github-actions[bot]),
      # consistent with how this repo's other automated commits (none yet,
      # but matching the pattern GitHub's own docs recommend) would look --
      # distinct from both the shared CMS account and any real person, so
      # it's obvious at a glance in the repo's commit history which updates
      # were this automation versus a real content edit.
      - name: Commit the log if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # `git diff --quiet` only compares against what Git already tracks,
          # so it silently reports "no change" for a brand-new, untracked
          # file -- which is exactly what cms-activity-log.md was on every
          # run so far, since it had never been committed. `git status
          # --porcelain` correctly reports both a new untracked file and a
          # changed tracked one; empty output means truly no change either way.
          if [ -z "$(git status --porcelain -- cms-activity-log.md)" ]; then
            echo "No change to the activity log; nothing to commit."
          else
            git add cms-activity-log.md
            git commit -m "Refresh CMS activity log"
            git push
          fi
