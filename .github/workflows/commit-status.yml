name: Update Commit Status

# Writes commit-status.md: a plain, readable list of the site's recent
# builds and deploys (did each change actually go live), read from this
# repository's GitHub Actions run history (see generate_commit_status.py
# for exactly how). Shown in the CMS sidebar as a read-only "Commit Status"
# file entry (.pages.yml) -- Pages CMS can only display files already in
# the repo, so this workflow is what keeps that file current.
#
# Answers a different question from cms-activity-log.yml: that one lists
# what was saved through the CMS; this one lists whether the site actually
# built successfully afterwards, for every change regardless of source.
#
# Runs automatically once a day, at midnight India time (00:00 IST), and on
# demand from the "Update commit status" button on the CMS Actions page (same
# payload-input mechanism as external-links.yml and cms-activity-log.yml; see
# the comment in external-links.yml for how that works in general). It does
# NOT run after each commit or build: an earlier version did (a workflow_run
# trigger on the main build plus a 3-minute wait), and it was removed on
# request in favour of one refresh per day. Never blocks or affects the site
# build itself -- this only ever writes the one status file, nothing else,
# and reads the main build's history without interfering with it.
#
# GitHub evaluates cron schedules in UTC: 00:00 IST (UTC+5:30, no daylight
# saving) is 18:30 UTC the previous day. GitHub may start scheduled runs a
# few minutes late when its runners are busy.
on:
  schedule:
    - cron: "30 18 * * *" # 18:30 UTC = 00:00 IST
  workflow_dispatch:
    inputs:
      # Pages CMS always sends its context here as JSON when its button starts
      # this workflow. Optional (not required: true as in Pages CMS's own
      # example) so running it by hand from GitHub's Actions tab still works
      # with the box left blank, and the schedule is unaffected.
      payload:
        description: "Filled in by the Pages CMS button; leave blank when running from GitHub"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  actions: read # this workflow reads OTHER runs' history (ci.yml) via the API, not just its own

jobs:
  update-status:
    runs-on: ubuntu-latest
    steps:
      # Records, in the run's own summary, what started it. Identical in
      # spirit to the same step in external-links.yml and
      # cms-activity-log.yml; kept duplicated per-workflow rather than
      # factored out, same reasoning as the comment in that file.
      - name: Note what started this run
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, os
          raw = os.environ.get("PAYLOAD", "").strip()
          event = os.environ.get("EVENT", "")
          actor = os.environ.get("ACTOR", "unknown")
          if raw:
              try:
                  user = (json.loads(raw).get("triggeredBy") or {})
                  who = "{} (GitHub: {}) using the Pages CMS button".format(
                      user.get("name") or "an unnamed CMS user",
                      user.get("githubUsername") or "no username given")
              except (ValueError, AttributeError):
                  who = "the Pages CMS button (its details could not be read)"
          elif event == "schedule":
              who = "the daily schedule"
          else:
              who = "{} on GitHub".format(actor)
          line = "Commit status refresh started by: " + who
          print(line)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(line + "\n")
          PY
        env:
          PAYLOAD: ${{ inputs.payload }}
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}

      # A shallow checkout is enough here, unlike cms-activity-log.yml:
      # generate_commit_status.py reads GitHub's Actions run history over
      # the API, not local git log, so this only needs a working copy of
      # the repo to write the output file into and commit from.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # Generates, commits (only if changed -- see the git status --porcelain
      # note below) and pushes commit-status.md, retrying the WHOLE thing
      # (not just the push) against fresh data if the push is rejected.
      #
      # Why a retry at all: another commit (a CMS save, the CMS activity
      # log's own refresh) can land on master between this job's checkout
      # and its push, and git then correctly rejects the push. This is a
      # confirmed real failure, not a hypothetical one: two runs failed this
      # way on 2026-10-05, back when this workflow ran after every build.
      #
      # Why discard-and-regenerate rather than rebase: this job only ever
      # changes commit-status.md, so a rebase onto another run's commit hits
      # a genuine merge conflict on that same file and leaves a half-finished
      # rebase that every further attempt fails against (reproduced with two
      # real git clones racing to push). On a rejected push we instead
      # `git reset --hard` to the remote, regenerate the page from current
      # data, and commit and push again; nothing in the discarded attempt is
      # worth keeping, since the page is always a fresh read of live state.
      - name: Generate and commit the status page, retrying if the push races another run
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          attempt=1
          max_attempts=5
          while true; do
            python3 generate_commit_status.py
            # `git status --porcelain`, not `git diff --quiet`: the latter
            # only compares against what Git already tracks, so it silently
            # reports "no change" for a brand-new, untracked file -- a real
            # bug found and fixed in cms-activity-log.yml's identical check
            # (every run of that workflow silently did nothing until it was
            # corrected), carried over here already fixed.
            if [ -z "$(git status --porcelain -- commit-status.md)" ]; then
              echo "No change to the commit status page; nothing to commit."
              break
            fi
            git add commit-status.md
            git commit -q -m "Refresh commit status"
            if git push; then
              echo "Pushed successfully on attempt $attempt."
              break
            fi
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "Could not push after $max_attempts attempts; giving up for this run. The next scheduled or triggered run will try again with fresh data."
              exit 1
            fi
            echo "Push rejected (another run pushed first) -- attempt $attempt of $max_attempts. Discarding this attempt and regenerating against the current remote state."
            git fetch origin master
            git reset --hard origin/master
            attempt=$((attempt + 1))
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
