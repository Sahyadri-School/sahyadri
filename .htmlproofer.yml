# html-proofer configuration for Sahyadri Connect
# https://github.com/gjtorikian/html-proofer

# Don't check external URLs (slow and unreliable in CI)
disable_external: true

# Allow anchor-only hrefs like href="#section"
allow_hash_href: true

# Ignore these URL patterns:
# - bare anchors (#)
# - mailto: and tel: links
# - /profiles/* — author profile pages are added gradually; not all
#   post authors have a profile page yet, so these links may be missing
# - /tags* — tag index uses anchors populated by JS at runtime
ignore_urls:
  - /^#/
  - /^mailto:/
  - /^tel:/
  - /\/profiles\//
  - /\/tags/

# Ignore these files from all checks:
# - feed.xml: not HTML
# - maintenance-status.json: not HTML
# - photos.html: <img src=""> are JS-populated via data-img attribute
# - profiles.html: <img src="${p.image}"> is a JS template literal
# Both photos.html and profiles.html have no explicit permalink, so
# Jekyll generates them as flat files (./_site/photos.html), not nested
# index.html files under a directory -- the earlier ".../photos/
# index.html" / ".../profiles/index.html" paths here never actually
# matched anything, confirmed by the Images check below failing on
# exactly ./_site/photos.html once actually enabled and run.
ignore_files:
  - "./_site/feed.xml"
  - "./_site/maintenance-status.json"
  - "./_site/photos.html"
  - "./_site/profiles.html"

# Links, Scripts, and Images. Images was briefly enabled once before,
# immediately failed, and had to be reverted because GitHub Actions caps
# error annotations at 10 per step -- the actual failure detail (which
# file) fell past that cap and couldn't be diagnosed from here. The
# person running this saw the real, untruncated log directly and it
# turned out to be exactly the photos.html false positive predicted
# above (the ignore_files path just didn't match the real output path).
# Re-enabled with that path corrected.
checks:
  - Links
  - Scripts
  - Images
