# html-proofer configuration for Sahyadri Connect
# https://github.com/gjtorikian/html-proofer

# Don't check external URLs (slow and unreliable in CI)
disable_external: true

# Allow anchor-only hrefs like href="#section"
allow_hash_href: true

# Ignore these URL patterns:
# - bare anchors (#)
# - mailto: and tel: links
# - /profiles/* — author profile pages are added gradually; not all
#   post authors have a profile page yet, so these links may be missing
# - /tags* — tag index uses anchors populated by JS at runtime
ignore_urls:
  - /^#/
  - /^mailto:/
  - /^tel:/
  - /\/profiles\//
  - /\/tags/

# Ignore these files from all checks:
# - feed.xml: not HTML
# - maintenance-status.json: not HTML
# - photos/index.html: <img src=""> are JS-populated via data-img attribute
# - profiles/index.html: <img src="${p.image}"> is a JS template literal
ignore_files:
  - "./_site/feed.xml"
  - "./_site/maintenance-status.json"
  - "./_site/photos/index.html"
  - "./_site/profiles/index.html"

# Only check Links and Scripts — not Images.
# Images was briefly enabled and immediately failed for a reason that
# couldn't be diagnosed: GitHub Actions caps error annotations at 10 per
# step, and the actual failure detail (which file, which image) fell
# past that cap every time. html-proofer itself can't be installed
# locally to reproduce the failure directly either (rubygems.org isn't
# reachable from the environment that was debugging this). Reverted
# rather than leave the build broken -- re-enabling this would need
# either a way to see the untruncated CI output, or a local Ruby/
# html-proofer setup to test against first.
checks:
  - Links
  - Scripts
